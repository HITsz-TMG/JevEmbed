[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevembed"
version = "0.1.0"
description = "Instruction embedding implementation of Jev-shaped decisions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
local = ["numpy>=1.26,<2", "torch>=2.1,<3", "transformers==4.51.0", "sentence-transformers==5.3.0", "huggingface-hub>=0.30,<1"]
train = ["numpy>=1.26,<2", "torch>=2.1,<3", "transformers==4.51.0", "sentence-transformers==5.3.0", "peft==0.18.1", "accelerate==1.13.0", "datasets==4.8.4"]
adapter = ["peft==0.18.1"]
kanana = ["torch==2.10.0", "torchvision==0.25.0", "transformers==5.5.3", "pillow==12.1.1", "einops==0.8.2", "safetensors==0.7.0"]
jeva = ["jeva-model @ git+https://github.com/LiQiiiii/Jeva.git@e2104e0720100f979f2cdd456a1cbbee96da0abd"]
clm = ["torch==2.9.1", "transformers==5.17.0", "peft==0.21.2", "accelerate==1.12.0", "huggingface-hub>=1.5,<2", "safetensors>=0.8,<1", "tqdm>=4.66,<5"]
gemma-decision = ["torch>=2.10,<3", "transformers==5.19.0", "huggingface-hub>=1.31,<2", "safetensors>=0.8,<1"]
http = ["httpx>=0.27,<1"]
synthesis = ["httpx>=0.27,<1", "jsonschema>=4.18,<5"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "jsonschema>=4.18,<5", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
jevembed = "jevembed.cli:main"
jevembed-benchmark = "jevembed.benchmark.cli:main"
jevembed-train = "jevembed.training.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jevembed = ["playground/*.html", "playground/*.css", "playground/*.js", "playground/*.mjs"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
