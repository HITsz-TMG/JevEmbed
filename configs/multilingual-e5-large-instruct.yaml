model_id: multilingual-e5-large-instruct
backend: sentence_transformers
model_name_or_path: intfloat/multilingual-e5-large-instruct
aliases: [intfloat/multilingual-e5-large-instruct]
revision: null
trust_remote_code: false
local_files_only: false
device: auto
dtype: auto
batch_size: 16
pooling: model_default
normalize_embeddings: true
expected_dimension: 1024
max_input_tokens: model_default
overflow_policy: error
attention_implementation: sdpa
prompts:
  query_template: "Instruct: {instruction}\nQuery: {text}"
  document_template: "{text}"
  similarity_instruction: "Retrieve semantically similar text."
scoring:
  choice_temperature: 0.5
  score_temperature: 0.5
  noul_criteria: {slope: 1.0, intercept: 0.0}
  noul_similarity: {slope: 1.0, intercept: 0.0}
  confidence: normalized_entropy
  calibration_status: uncalibrated
