model_id: qwen3-embedding-8b
backend: sentence_transformers
model_name_or_path: Qwen/Qwen3-Embedding-8B
aliases: [Qwen/Qwen3-Embedding-8B]
trust_remote_code: false
local_files_only: false
device: auto
dtype: auto
batch_size: 4
pooling: model_default
normalize_embeddings: true
expected_dimension: 4096
# Model card's supported context; architecture's 40960 positions are not the serving limit.
max_input_tokens: 32768
overflow_policy: error
attention_implementation: sdpa
prompts:
  query_template: "Instruct: {instruction}\nQuery: {text}"
  document_template: "{text}"
  similarity_instruction: "Retrieve semantically similar text."
  noul_format: retrieval
scoring:
  choice_temperature: 0.1
  score_temperature: 0.1
  noul_criteria: {slope: 10.0, intercept: 0.0}
  noul_similarity: {slope: 10.0, intercept: 0.0}
  calibration_status: uncalibrated
